<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3e9">
  <meta name="description" content="An interactive Calm Table design preview for Game Shelf. Example data; no real rooms or moves.">
  <title>Calm Table · Game Shelf design preview</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="preview-strip"><span><strong>Design preview</strong><span class="preview-detail"> · example data, no real rooms or moves</span></span><button id="review" class="text-button" aria-haspopup="dialog">Explore scenarios <span aria-hidden="true">↗</span></button></div>
  <header class="app-header"><a class="brand" href="#home" aria-label="Game Shelf home"><span class="brand-mark" aria-hidden="true">⬡</span><span>Game Shelf</span></a><div class="header-actions"><span id="connection" class="connection"><span class="status-dot"></span>Preview online</span><button id="room" class="icon-button" aria-label="Room details" title="Room details">☰</button></div></header>
  <main id="app" tabindex="-1"></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-heading"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="Close panel">×</button></div><div id="sheet-body"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
