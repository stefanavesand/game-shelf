<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><base href="../../play/"><title>Game Shelf · Motion lab</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./presentation/layout.css"><link rel="stylesheet" href="./presentation/motion.css"><link rel="stylesheet" href="./presentation/game-layout.css"><link rel="stylesheet" href="../prototype/motion-lab/style.css"></head>
<body class="table-screen lab-page"><header class="app-header"><button id="tune" aria-label="Tune animations">Tune</button><span class="brand">Motion lab <small id="motion-state"></small></span><button id="replay" aria-label="Replay selected clip">Replay</button></header><main id="app" tabindex="-1"></main>
<dialog id="tuning" aria-labelledby="lab-title"><div class="lab-heading"><h1 id="lab-title">Tune animations</h1><button type="button" id="close" aria-label="Close tuning">×</button></div><p>Scripted demo clips using the real game renderer and animation code. No sign-in or access to real game saves.</p><form id="settings-form"><label>Clip<select id="clip"><option value="roll">Dice and resource delivery</option><option value="road">Build a road</option><option value="settlement">Build a settlement</option><option value="city">Upgrade to a city</option><option value="robber">Move the robber</option></select></label><div class="presets"><button type="button" data-preset="current">Current game</button><button type="button" data-preset="clear">More visible</button><button type="button" data-preset="slow">Very slow</button></div><div id="ranges"></div><label class="check"><input type="checkbox" id="respect-motion">Respect device reduced-motion setting</label><p id="device-status" role="status"></p><p id="playback-status" role="status"></p><div class="lab-actions"><button class="primary" type="submit">Apply & replay</button><button type="button" id="sequence">Play sequence</button><button type="button" id="stop">Stop</button><button type="button" id="share">Share settings</button><button type="button" id="export">Copy JSON</button><button type="button" id="reset">Reset settings</button></div><p id="settings-status" role="status"></p><label id="share-output" hidden>Copy this value<textarea readonly id="shared-value"></textarea></label></form></dialog>
<script type="module" src="../prototype/motion-lab/app.js"></script></body></html>
