<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3e9"><meta name="description" content="A private internet game for two friends and one bot.">
  <title>Game Shelf · Catan</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./presentation/layout.css">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Game Shelf">
</head>
<body>
  <header class="app-header"><button id="room" class="icon-button" aria-label="Open menu" aria-haspopup="dialog">☰</button><a class="brand" href="#home" aria-label="Game Shelf home"><img class="brand-mark" src="./icons/icon-192.png" width="28" height="28" alt=""><span>Game Shelf</span></a><span class="header-turn" aria-hidden="true"></span><div class="header-actions"><button id="help" class="icon-button" type="button" aria-label="Help and rules">?</button></div></header>
  <section id="startup-error" role="alert" hidden><h1>App resources unavailable</h1><p>Reconnect and reload to restore compatible app files. Your saved games have not been deleted. If the problem continues, keep this installation and report it.</p><button type="button" onclick="location.reload()">Reload</button></section>
  <main id="app" tabindex="-1"></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-heading"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="Close panel">×</button></div><div id="sheet-body"></div></dialog>
  <dialog id="trade-reply" aria-labelledby="trade-reply-title"><div class="sheet-heading"><h2 id="trade-reply-title">Trade offer</h2><button id="close-trade-reply" class="icon-button" aria-label="Close offer">×</button></div><div id="trade-reply-body"></div></dialog>
  <dialog id="sidebar" aria-labelledby="sidebar-title"><div class="sheet-heading"><h2 id="sidebar-title">Game Shelf</h2><button class="icon-button" data-action="menu-close" aria-label="Close menu">×</button></div><div id="sidebar-body"></div><footer class="sidebar-status"><span class="status-label">Game status</span><button id="refresh" class="text-button" type="button" aria-label="Check the game"><span id="connection">Connecting…</span></button><span class="status-label">App status</span><span id="offline-status" role="status">Preparing offline…</span><small id="app-version"></small></footer></dialog>
  <script type="module" src="./app.js" onerror="document.getElementById('startup-error').hidden=false"></script>
</body>
</html>
